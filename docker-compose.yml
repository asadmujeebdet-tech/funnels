services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
